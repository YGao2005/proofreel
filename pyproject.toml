[project]
name = "proofreel"
dynamic = ["version"]
description = "Record an agent driving a screen as a review video and page: a gliding pointer, click rings, auto zoom, captions, and checks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pillow>=10.1,<13", "vncdotool==1.2.0", "websocket-client>=1.6"]

[project.optional-dependencies]
network = ["mitmproxy>=11"]
browser = ["websocket-client"]

[project.scripts]
proofreel = "proofreel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/proofreel/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/proofreel"]

[tool.hatch.build.targets.wheel.force-include]
"skills/proofreel" = "proofreel/skill"
