<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Acme Notes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>:root {
  --bg: #f3f4f6; --surface: #ffffff; --surface-2: #f8f9fa; --surface-3: #eceef1; --hover: #f1f3f5;
  --line: #e2e5ea; --line-strong: #cdd2da; --fg-1: #15171c; --fg-2: #4d5460; --fg-3: #666d78;
  --accent: #0962cc; --accent-bg: #e9f1fd; --focus: #0962cc; --on-accent: #ffffff;
  --good: #1d7a3a; --good-bg: #e3f3e8; --bad: #b4232a; --bad-bg: #fbe5e6; --warn: #8a5300; --warn-bg: #fbefd5;
  --stage: #0b0c0e; --scrim: rgba(20, 21, 24, .80); --scrim-soft: rgba(20, 21, 24, .58); --on-scrim: #ffffff;
  --scrim-good: rgba(36, 138, 61, .92); --scrim-bad: rgba(215, 0, 21, .92);
  --hatch: rgba(16, 18, 22, .13); --pop-shadow: 0 8px 24px rgba(16, 18, 22, .16);
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --fs-12: 12px; --fs-13: 13px; --fs-14: 14px; --fs-16: 16px; --fs-24: 24px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s7: 32px;
  --r-sm: 4px; --r-md: 6px; --r-lg: 10px;
  --lane-label: 164px; --lane-tail: 96px; --ctl: 28px; --head-h: 40px; --time-w: 52px; --ratio: 1.6; --ease: cubic-bezier(.2, .7, .2, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d0f12; --surface: #15181d; --surface-2: #1a1e24; --surface-3: #232830; --hover: #1e232a;
  --line: #262b33; --line-strong: #363d48; --fg-1: #e8eaee; --fg-2: #a2a8b3; --fg-3: #8a919c;
  --accent: #6aa8ff; --accent-bg: #16294a; --focus: #6aa8ff; --on-accent: #0b1220;
  --good: #6fd08f; --good-bg: #16301f; --bad: #ff8a8f; --bad-bg: #3a1a1d; --warn: #f0b95a; --warn-bg: #3a2c10;
  --stage: #000000; --hatch: rgba(255, 255, 255, .11); --pop-shadow: 0 8px 24px rgba(0, 0, 0, .5);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d0f12; --surface: #15181d; --surface-2: #1a1e24; --surface-3: #232830; --hover: #1e232a;
  --line: #262b33; --line-strong: #363d48; --fg-1: #e8eaee; --fg-2: #a2a8b3; --fg-3: #8a919c;
  --accent: #6aa8ff; --accent-bg: #16294a; --focus: #6aa8ff; --on-accent: #0b1220;
  --good: #6fd08f; --good-bg: #16301f; --bad: #ff8a8f; --bad-bg: #3a1a1d; --warn: #f0b95a; --warn-bg: #3a2c10;
  --stage: #000000; --hatch: rgba(255, 255, 255, .11); --pop-shadow: 0 8px 24px rgba(0, 0, 0, .5);
  color-scheme: dark }

* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
body { margin: 0; background: var(--bg); color: var(--fg-1); font: 400 var(--fs-14)/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
::selection { background: var(--accent-bg); color: var(--fg-1); }
textarea, input { caret-color: var(--accent); }
a { color: var(--accent); text-underline-offset: 3px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; text-align: inherit; cursor: pointer; }
summary { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1440px; margin: 0 auto; padding-block: var(--s6) var(--s4);
  padding-left: max(var(--s4), env(safe-area-inset-left, 0px)); padding-right: max(var(--s4), env(safe-area-inset-right, 0px)); }
footer { margin-top: var(--s3); color: var(--fg-3); font-size: var(--fs-13); }
[hidden] { display: none !important; }
.icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.t, .time, .when { font: 400 var(--fs-12)/1.5 var(--mono); color: var(--fg-3); font-variant-numeric: tabular-nums; }
.time { font-size: var(--fs-13); color: var(--fg-2); white-space: nowrap; }
.t, .time, .when, td, .detail, dt, .label { font-variant-numeric: tabular-nums; }

header.top { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: var(--s3) var(--s6); margin-bottom: var(--s5); }
header.top .title { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; flex: 1 1 420px; }
header.top .name { display: flex; align-items: center; gap: var(--s3); min-width: 0; }
header.top .side { display: flex; flex-direction: column; align-items: flex-end; gap: var(--s3); max-width: 100%; }
h1 { font-size: var(--fs-24); font-weight: 600; line-height: 1.2; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.lede { color: var(--fg-2); max-width: 72ch; margin: 0; }
.cause { display: inline-flex; align-self: flex-start; align-items: baseline; gap: var(--s3); max-width: 100%; text-align: left; color: var(--bad); font: 500 var(--fs-14)/1.5 var(--sans); }
.cause:hover span:first-child { text-decoration: underline; text-underline-offset: 3px; }
.cause .t { color: var(--bad); font-size: var(--fs-13); }
.meta { display: flex; flex-wrap: wrap; color: var(--fg-3); font-size: var(--fs-13); }
.meta span + span::before { content: "\00b7"; margin-inline: var(--s2); }

.chip { display: inline-flex; align-items: center; height: 20px; padding: 0 var(--s2); border-radius: var(--r-sm); font: 600 var(--fs-12)/1 var(--sans);
  background: var(--surface-3); color: var(--fg-2); white-space: nowrap; flex: none; }
.chip.ok { background: var(--good-bg); color: var(--good); } .chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.info { background: var(--warn-bg); color: var(--warn); }

.btn { cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  height: var(--ctl); padding: 0 var(--s3); border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--surface);
  color: var(--fg-1); font: 500 var(--fs-14)/1 var(--sans); white-space: nowrap; transition: background-color 150ms var(--ease); }
.btn:hover { background: var(--hover); }
.btn.small { height: 24px; padding: 0 var(--s2); font-size: var(--fs-13); }
.btn.tool { border-color: transparent; background: transparent; color: var(--fg-2); padding: 0 var(--s2); }
.btn.tool:hover { background: var(--hover); color: var(--fg-1); }
.btn.icon-only { width: var(--ctl); padding: 0; }
.btn[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
.choices { display: flex; gap: var(--s2); flex-wrap: wrap; }

.seg { display: inline-flex; gap: var(--s1); padding: var(--s1); border-radius: var(--r-md); background: var(--surface-3); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg button { display: inline-flex; align-items: center; gap: var(--s2); height: 24px; padding: 0 var(--s3); border: 1px solid transparent;
  border-radius: var(--r-sm); color: var(--fg-2); font: 500 var(--fs-13)/1 var(--sans); white-space: nowrap; transition: background-color 150ms var(--ease), color 150ms var(--ease); }
.seg button:hover { color: var(--fg-1); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg-1); border-color: var(--line-strong); }
.seg span.bad { color: var(--bad); }
.seg .ok[aria-pressed="true"] { background: var(--good-bg); color: var(--good); border-color: var(--good); }
.seg .bad[aria-pressed="true"] { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.seg .when { font-size: var(--fs-12); color: var(--fg-3); }
.review { display: flex; flex-direction: column; align-items: flex-end; gap: var(--s1); }
.review .who { color: var(--fg-3); font-size: var(--fs-12); text-align: right; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: clip; display: flex; flex-direction: column; min-width: 0; }
.panel > .head { display: flex; align-items: center; gap: var(--s2); min-height: var(--head-h); padding: 0 var(--s3);
  border-bottom: 1px solid var(--line); background: var(--surface); flex: none; }
.panel > .body { min-height: 0; }
.dock { max-width: 720px; }
.dock:not(:has(> .section:not([hidden]))) { display: none; }
.section + .section { border-top: 1px solid var(--line); }
.section h2 { margin: 0; padding: var(--s3) var(--s4) 0; font: 600 var(--fs-14)/1.4 var(--sans); color: var(--fg-1); }
.section .body { padding: var(--s2) var(--s4) var(--s3); display: flex; flex-direction: column; gap: var(--s2); }
.ask-row { display: flex; gap: var(--s2); align-items: flex-start; }
textarea { flex: 1; width: 100%; min-height: var(--ctl); field-sizing: content; max-height: 160px; resize: none; padding: var(--s1) var(--s2); border-radius: var(--r-md);
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg-1); font: 400 var(--fs-14)/1.5 var(--sans); }
textarea:focus-visible { outline-offset: -1px; }
.answer { white-space: pre-wrap; color: var(--fg-1); }
.answer:empty { display: none; }

.tabs { display: flex; gap: var(--s1); overflow-x: auto; scrollbar-width: none; min-width: 0; align-self: stretch; }
.tabs.overflow { mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent); }
.tabs [role=tab] { display: inline-flex; align-items: center; gap: var(--s2); padding: 0 var(--s2); white-space: nowrap;
  color: var(--fg-2); font: 500 var(--fs-14)/1 var(--sans); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 150ms var(--ease), border-color 150ms var(--ease); }
.tabs [role=tab]:hover { color: var(--fg-1); }
.tabs [role=tab][aria-selected="true"] { color: var(--fg-1); border-bottom-color: var(--accent); }
.empty-pane { padding: var(--s4); }
.placeholder { margin: 0; padding: var(--s6) var(--s4); border: 1px dashed var(--line-strong); border-radius: var(--r-md); color: var(--fg-3); text-align: center; }

.stage .media { background: var(--stage); display: flex; justify-content: center; }
.screen { position: relative; overflow: hidden; container-type: inline-size; background: var(--stage); width: 100%; }
.screen video { display: block; width: 100%; height: auto; transform-origin: 0 0; cursor: pointer; }
.screen:fullscreen { display: grid; place-items: center; }
.screen:fullscreen > * { grid-area: 1 / 1; }
.screen:fullscreen video { width: auto; max-width: 100vw; max-height: 100vh; }
.timebar { display: grid; grid-template-columns: var(--lane-label) minmax(0, 1fr) var(--lane-tail); align-items: center; column-gap: var(--s3); row-gap: var(--s1);
  padding: var(--s2) var(--s3) var(--s3); border-top: 1px solid var(--line); }
.timebar .lead { display: flex; align-items: center; gap: var(--s1); }
.timebar .tools { display: flex; align-items: center; justify-content: flex-end; gap: var(--s1); }
.btn.tool .label { display: none; }
.bar { position: relative; height: 24px; cursor: pointer; }
.bar .track { position: absolute; left: 0; right: 0; top: 10px; height: 4px; border-radius: var(--r-sm); background: var(--surface-3); }
.bar .done { position: absolute; left: 0; top: 10px; height: 4px; border-radius: var(--r-sm); background: var(--accent); width: var(--at); }
.bar .done::after { content: ""; position: absolute; right: -6px; top: -4px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); box-sizing: content-box; margin: -2px; }
.bar i { position: absolute; top: 8px; width: 2px; height: 8px; margin-left: -1px; border-radius: 0; background: var(--fg-3); }
.bar i.ok { background: var(--good); } .bar i.bad { background: var(--bad); width: 3px; height: 12px; top: 6px; margin-left: -2px; }
.bar i.step { background: var(--fg-2); }

.help { position: relative; }
.help summary { list-style: none; } .help summary::-webkit-details-marker { display: none; }
.help .pop p { margin: 0 0 var(--s2); }
.help .pop dl { display: grid; grid-template-columns: auto 1fr; gap: var(--s1) var(--s3); margin: 0; }
.help .pop dt { font: 400 var(--fs-12)/1.5 var(--mono); color: var(--fg-1); white-space: nowrap; } .help .pop dd { margin: 0; }
.help .pop { position: absolute; right: 0; bottom: calc(100% + var(--s2)); z-index: 20; width: min(340px, 80vw); padding: var(--s3); border-radius: var(--r-md);
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--pop-shadow); color: var(--fg-2); font-size: var(--fs-13); }

.overlay { position: absolute; inset: 0; pointer-events: none; font-family: var(--sans); }
.overlay .pill { position: absolute; color: var(--on-scrim); background: var(--scrim); border-radius: var(--r-md);
  padding: .5em .75em; line-height: 1.2; white-space: nowrap; max-width: 88%; overflow: hidden; text-overflow: ellipsis; }
.overlay .top { position: absolute; top: 1.7cqw; left: 1.7cqw; display: flex; gap: .5cqw; }
.overlay .top .pill { position: static; font-size: max(12px, 1.1cqw); background: var(--scrim-soft); font-variant-numeric: tabular-nums; }
.overlay .top .pill.state.ok { background: var(--scrim-good); } .overlay .top .pill.state.bad { background: var(--scrim-bad); }
.overlay .now { top: 1.7cqw; right: 1.7cqw; font-size: max(12px, 1.3cqw); }
.overlay .now.ok { background: var(--scrim-good); } .overlay .now.bad { background: var(--scrim-bad); }
.overlay .bottom { position: absolute; left: var(--s3); right: var(--s3); bottom: var(--s3); display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: end; column-gap: var(--s2); }
.overlay .bottom .pill { position: static; }
.overlay .caption { grid-column: 2; max-width: none; font-size: max(12px, 1.55cqw); }
.overlay .caption b { font-weight: 400; opacity: .7; margin-right: .75em; }
.overlay .live { grid-column: 1; grid-row: 1; justify-self: start; min-width: 0; max-width: 100%; display: flex; flex-direction: column; gap: .25em; border-radius: var(--r-md);
  font: 400 max(12px, 1.1cqw)/1.3 var(--mono); font-variant-numeric: tabular-nums; color: var(--fg-1); background: color-mix(in srgb, var(--surface) 85%, transparent);
  border: 1px solid var(--line); }
.overlay .live span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.overlay .live b { font: 400 1em var(--sans); color: var(--fg-2); margin-right: .5em; }

.list, .list ol, .machine ol { list-style: none; margin: 0; padding: 0; }
li .row { display: grid; grid-template-columns: var(--time-w) minmax(0, 1fr) auto; gap: var(--s3); align-items: start;
  padding: var(--s2) var(--s4); cursor: pointer; transition: background-color 150ms var(--ease); }
li .row:hover { background: var(--hover); }
li.bad > .row { background: var(--bad-bg); }
li.now > .row, li.now > details > summary { background: var(--accent-bg); }
li.now.bad > .row { background: var(--bad-bg); }
.text { min-width: 0; overflow-wrap: anywhere; line-height: 1.5; }
.kind { color: var(--fg-3); font: 400 var(--fs-13) var(--mono); }
.detail { display: block; color: var(--fg-3); font: 400 var(--fs-13)/1.4 var(--sans); margin-top: var(--s1); white-space: pre-wrap; }
li.bad > .row .detail { color: var(--bad); }
li.bad > .row .t, .numbers tr.bad td .m, .numbers tr.bad th { color: var(--fg-2); }
.numbers tr.bad td .m.bad { color: var(--bad); }
li.step .text { font-weight: 600; }
li.more > details > summary { list-style: none; display: flex; align-items: center; gap: var(--s1); padding: var(--s1) var(--s4) var(--s1) calc(var(--s4) + var(--time-w) + var(--s3) - var(--s1));
  color: var(--fg-3); font-size: var(--fs-13); }
li.more > details > summary::-webkit-details-marker { display: none; }
li.more > details > summary .icon, .tracks .fold .icon { transition: transform 150ms var(--ease); }
li.more > details[open] > summary .icon, .tracks .fold[aria-expanded="true"] .icon { transform: rotate(90deg); }
li.more > details > summary:hover { color: var(--fg-1); }
li.more ol { margin: 0 0 var(--s1) calc(var(--s4) + var(--time-w) + var(--s3)); border-left: 1px solid var(--line); }
li.more .row { padding-block: var(--s1); padding-left: var(--s2); grid-template-columns: calc(var(--time-w) - var(--s1)) minmax(0, 1fr) auto; }
li.more .text { color: var(--fg-2); }

.stats, .journeys { padding: var(--s4); display: flex; flex-direction: column; gap: var(--s3); overflow-x: auto; }
.stats .hint, .net .hint { margin: 0; color: var(--fg-2); font-size: var(--fs-13); }
.journeys h2 { margin: 0; display: flex; align-items: baseline; gap: var(--s3); font: 600 var(--fs-14)/1.5 var(--sans); }
.journeys h2 .meta { font-weight: 400; }
.numbers { width: 100%; max-width: 880px; border-collapse: collapse; table-layout: fixed; }
.numbers th { padding: 0 var(--s2) var(--s1); text-align: right; font: 600 var(--fs-12)/1.5 var(--sans); color: var(--fg-3); border-bottom: 1px solid var(--line); }
.numbers td { padding: var(--s2); text-align: right; font: 400 var(--fs-13)/1.5 var(--mono); font-variant-numeric: tabular-nums;
  border-bottom: 1px solid var(--line); vertical-align: top; }
.numbers th:first-child, .numbers td:first-child { text-align: left; }
.numbers td:first-child { font: 400 var(--fs-14)/1.5 var(--sans); overflow-wrap: anywhere; }
.numbers td .m { display: block; color: var(--fg-3); font: 400 var(--fs-12)/1.5 var(--mono); }
.numbers td .m.bad { color: var(--bad); font-family: var(--sans); }
.numbers td .m a + a { margin-left: 8px; }
.numbers tbody tr { cursor: pointer; transition: background-color 150ms var(--ease); } .numbers tbody tr:hover { background: var(--hover); }
.numbers tr.bad td { background: var(--bad-bg); }
.numbers tr.bad td .m, .numbers tr.bad th { color: var(--fg-2); }
.numbers tr.bad td .m.bad { color: var(--bad); }
.numbers tr[aria-current="true"] td { background: var(--accent-bg); }
.numbers a { color: var(--fg-1); font-weight: 500; text-decoration: none; }
.numbers a:hover { text-decoration: underline; text-underline-offset: 3px; }
col.w88 { width: 88px; } col.w96 { width: 96px; } col.w112 { width: 112px; } .stats-table col.budget { width: 296px; }
.numbers td:last-child, .numbers th:last-child { padding-right: var(--s2); }
.stats-table td:last-child, .stats-table th:last-child { text-align: left; }
.journey-table td:not(:first-child), .journey-table th:not(:first-child) { text-align: left; }
.budget { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s2); font: 400 var(--fs-13)/20px var(--sans); }
.budget.bad span { color: var(--bad); }
.net { padding: var(--s2) 0; --req-cols: minmax(200px, 36%) minmax(0, 1fr) 112px; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s3); padding: var(--s2) var(--s4); color: var(--fg-2); font-size: var(--fs-12); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: var(--r-sm); margin-right: var(--s1); vertical-align: -1px; }
.req { display: grid; grid-template-columns: var(--req-cols); align-items: center; column-gap: var(--s3); height: 28px; padding: 0 var(--s4); cursor: pointer; transition: background-color 200ms var(--ease); }
.req.axis-row { cursor: default; height: 20px; } .net .axis { grid-column: auto; position: relative; background: none; }
.req:not(.axis-row):hover { background: var(--hover); }
.req .name { display: flex; min-width: 0; font: 400 var(--fs-13)/28px var(--mono); white-space: pre; }
.req .dim { color: var(--fg-3); flex: none; } .req .dim.host { margin-right: 0; }
.req .path { overflow: hidden; text-overflow: ellipsis; } .req .path.tail { flex: none; overflow: visible; } .req .path.head { min-width: 0; }
.req .d { display: flex; justify-content: flex-end; align-items: center; gap: var(--s2); font: 400 var(--fs-13)/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--fg-2); }
.req .d .dim { font: 400 var(--fs-13)/1 var(--mono); }
.req.bad, .req.hit { background: var(--bad-bg); }
.req.bad .name .path { color: var(--bad); }
.req.bad .dim { color: var(--fg-2); }
.fall { position: relative; height: 8px; border-radius: var(--r-sm); background: var(--surface-2); }
.fall span { position: absolute; top: 0; bottom: 0; min-width: 3px; }
.fall .whole { background: var(--line-strong); }
.p0 { background: var(--fg-3); } .p1 { background: var(--accent); } .p2 { background: var(--good); } .p3 { background: var(--line-strong); } .p4 { background: var(--fg-2); }

.stack { display: grid; gap: var(--s3); grid-template-columns: minmax(0, 1fr); }
.views > .head { position: sticky; top: 0; z-index: 3; }
.views > .body { background: var(--surface); }

.cols, .main { display: flex; flex-direction: column; gap: var(--s3); min-width: 0; }

<script>// The state machine of a review folder: the path of every run through its states, merged into one graph and laid
// out from top to bottom. Pure functions: the page draws the result, and node runs the tests.
const Machine = (() => {
  const START = "Start";

  // A node for each state name, and an edge for each pair of states that follow each other in a run. Each visit and
  // each step along an edge remembers its run and its place in that run's path.
  function build(runs) {
    const nodes = new Map(), edges = new Map();
    const node = id => nodes.get(id) || nodes.set(id, { id, visits: [] }).get(id);
    runs.forEach((r, run) => {
      if (!r.states || !r.states.length) return;
      let from = node(START).id;
      r.states.forEach((v, visit) => {
        node(v.name).visits.push({ run, visit });
        const key = JSON.stringify([from, v.name]);
        if (!edges.has(key)) edges.set(key, { from, to: v.name, takes: [] });
        edges.get(key).takes.push({ run, visit });
        from = v.name;
      });
    });
    return { nodes: [...nodes.values()], edges: [...edges.values()] };
  }

  // Layers come from the longest path from Start, with the edges that go back (loops) left out. A long edge gets a
  // point on each layer that it crosses. Each layer is sorted by the mean place of its neighbours, down and up a few
  // times, to cut crossings. Edges that go back run in lanes at the side nearer to where they start.
  // size(id) gives a node's [width, height]. Returns nodes with x, y, w, h, and edges with an SVG path d and a
  // label place [x, y, anchor, slope] (the slope is how far the curve runs sideways for each unit down at the label).
  function layout(graph, size, gap = { x: 28, y: 56, lane: 14 }) {
    const out = new Map(graph.nodes.map(n => [n.id, []]));
    for (const e of graph.edges) out.get(e.from).push(e);
    const seen = new Map(), back = new Set(), order = [];
    const walk = id => {
      seen.set(id, 1);
      for (const e of out.get(id)) {
        if (seen.get(e.to) === 1) back.add(e);
        else if (!seen.has(e.to)) walk(e.to);
      }
      seen.set(id, 2);
      order.unshift(id);
    };
    for (const n of graph.nodes) if (!seen.has(n.id)) walk(n.id);
    const rank = new Map(order.map(id => [id, 0]));
    for (const id of order) for (const e of out.get(id)) if (!back.has(e)) rank.set(e.to, Math.max(rank.get(e.to), rank.get(id) + 1));

    const layers = [], items = new Map();
    const put = item => { (layers[item.rank] = layers[item.rank] || []).push(item); return item; };
    for (const id of order) {
      const [w, h] = size(id);
      items.set(id, put({ id, w, h, rank: rank.get(id), up: [], down: [] }));
    }
    const routes = graph.edges.map(e => {
      const chain = [items.get(e.from)];
      if (back.has(e)) chain.push(items.get(e.to));
      else {
        for (let r = rank.get(e.from) + 1; r < rank.get(e.to); r++) chain.push(put({ w: 8, h: 0, rank: r, up: [], down: [], dummy: true }));
        chain.push(items.get(e.to));
        for (let i = 1; i < chain.length; i++) { chain[i - 1].down.push(chain[i]); chain[i].up.push(chain[i - 1]); }
      }
      return { edge: e, back: back.has(e), chain };
    });

    layers.forEach(l => l.forEach((it, i) => { it.order = i; }));
    const mean = list => list.length ? list.reduce((s, it) => s + it.order, 0) / list.length : null;
    for (let pass = 0; pass < 4; pass++) {
      const down = pass % 2 === 0;
      for (const layer of down ? layers.slice(1) : layers.slice(0, -1).reverse()) {
        const key = new Map(layer.map(it => [it, mean(down ? it.up : it.down) ?? it.order]));
        layer.sort((a, b) => key.get(a) - key.get(b) || a.order - b.order);
        layer.forEach((it, i) => { it.order = i; });
      }
    }

    const span = l => l.reduce((s, it) => s + it.w, 0) + gap.x * (l.length - 1);
    const inner = Math.max(...layers.map(span));
    let top = 0;
    const rows = layers.map(l => {
      const h = Math.max(...l.map(it => it.h)), row = { top, h };
      let x = (inner - span(l)) / 2;
      for (const it of l) { it.x = x; it.y = top + (h - it.h) / 2; x += it.w + gap.x; }
      top += h + gap.y;
      return row;
    });
    const loops = routes.filter(r => r.back && r.edge.from !== r.edge.to);
    const side = r => r.chain[0].x + r.chain[0].w / 2 < inner / 2 ? "left" : "right";
    const lanes = { left: loops.filter(r => side(r) === "left"), right: loops.filter(r => side(r) === "right") };
    const margin = gap.lane * (lanes.left.length + 1);
    for (const it of items.values()) it.x += margin;
    for (const l of layers) for (const it of l) if (it.dummy) it.x += margin;

    const curve = (a, b) => ` C${a[0]},${(a[1] + b[1]) / 2} ${b[0]},${(a[1] + b[1]) / 2} ${b[0]},${b[1]}`;
    const edges = routes.map(r => {
      const [a, b] = [r.chain[0], r.chain[r.chain.length - 1]];
      let d, label = null;
      if (r.back && a === b) {
        const [x, y] = [a.x + a.w, a.y + a.h / 2];
        d = `M${x},${y - 6} C${x + 26},${y - 20} ${x + 26},${y + 20} ${x},${y + 6}`;
      } else if (r.back) {
        const left = side(r) === "left", k = lanes[left ? "left" : "right"].indexOf(r) + 1;
        const lane = left ? margin - gap.lane * k : margin + inner + gap.lane * k;
        const [x1, y1, x2, y2] = left ? [a.x, a.y + a.h / 2, b.x, b.y + b.h / 2] : [a.x + a.w, a.y + a.h / 2, b.x + b.w, b.y + b.h / 2];
        const s = left ? -1 : 1, bend = Math.min(8, Math.abs(y1 - y2) / 2);
        d = `M${x1},${y1} H${lane - s * bend} Q${lane},${y1} ${lane},${y1 - bend} V${y2 + bend} Q${lane},${y2} ${lane - s * bend},${y2} H${x2}`;
      } else {
        const points = [[a.x + a.w / 2, a.y + a.h]];
        for (const it of r.chain.slice(1, -1)) {
          const row = rows[it.rank];
          points.push([it.x + it.w / 2, row.top], [it.x + it.w / 2, row.top + row.h]);
        }
        points.push([b.x + b.w / 2, b.y]);
        d = `M${points[0]}`;
        for (let i = 1; i < points.length; i++) d += i % 2 ? curve(points[i - 1], points[i]) : ` L${points[i]}`;
        // An edge that leans left keeps its label on the left, so the labels of a branch do not run into each other.
        const lean = Math.sign(points[1][0] - points[0][0]);
        const slope = 1.5 * Math.abs(points[1][0] - points[0][0]) / Math.max(1, points[1][1] - points[0][1]);
        label = [(points[0][0] + points[1][0]) / 2, (points[0][1] + points[1][1]) / 2, lean < 0 ? "end" : "start", slope];
      }
      return { ...r.edge, back: r.back, d, label };
    });
    const nodes = order.map(id => { const { x, y, w, h } = items.get(id); return { id, x, y, w, h }; });
    const width = margin + inner + gap.lane * (lanes.right.length + 1) + (routes.some(r => r.back && r.edge.from === r.edge.to) ? 28 : 0);
    return { width, height: top - gap.y, nodes, edges };
  }

  // A node's verdict in one run: "bad" when a visit failed, "ok" when one passed, "unchecked" when it was visited
  // with no checks, and null when the run did not visit it.
  function verdict(states, id) {
    const visits = (states || []).filter(v => v.name === id);

  const worst = s => s.points ? s.points.reduce((a, p) => (p[3] ?? p[1]) > (a[3] ?? a[1]) ? p : a)[0]
    : s.spans ? s.spans.reduce((a, p) => p[1] > a[1] ? p : a)[0] : s.marks && s.marks.length ? s.marks[0][0] : null;
  const go = s => { const t = worst(s); if (t !== null) seek(toVideo(r, t) - 0.3); };
  const sentence = b => $("div", { class: `budget${b.ok === false ? " bad" : ""}` }, $("span", { text: Verdict.budgetText(b, r, b.detail) }), chip(...budgetChip(b)));
  const body = $("tbody");
  for (const b of budgets.filter(b => !b.series.length)) body.append($("tr", { class: "bad" },
    $("td", {}, document.createTextNode(b.glob), $("span", { class: "m", text: b.detail || "no data" })),
    $("td", { colspan: "3", text: "-" }), $("td", {}, sentence(b))));
  for (const s of series.slice().sort((a, b) => rankOf(r, a) - rankOf(r, b))) {
    const mine = budgetsOf(r, s), none = s.stats.p50 === undefined;
    body.append($("tr", { class: mine.some(b => b.ok === false) ? "bad" : "", tabindex: "0", onclick: () => go(s),
      onkeydown: ev => { if (ev.key === "Enter") go(s); } },
      $("td", {}, document.createTextNode(nameOf(s)), s.label ? $("span", { class: "m", text: s.m }) : null,
        s.stats.failed && groupOf(s) === "input" ? $("span", { class: "m bad", text: `${Verdict.plural(s.stats.failed, "input")} got no change on the screen` }) : null),
      ...(none ? [$("td", { colspan: "3", text: Verdict.plural(s.stats.count, "mark") })] : ["p50", "p95", "max"].map(k => $("td", { text: Tracks.format(s.stats[k], s.unit) }))),
      $("td", {}, ...mine.map(sentence))));
  }
  box.append($("table", { class: "numbers stats-table" },
    $("colgroup", {}, ...["", "w96", "w96", "w96", "budget"].map(c => $("col", c ? { class: c } : {}))),
    $("thead", {}, $("tr", {}, ...["Series", "p50", "p95", "max", "Budget"].map(h => $("th", { text: h })))), body));
  const quiet = Object.entries((r.metrics && r.metrics.probes) || {}).filter(([, p]) => p.status && p.status !== "ok");
  for (const [name, p] of quiet) box.append($("p", { class: "hint", text: `Probe ${name} ${p.status}${p.note ? ": " + p.note : ""}` }));
  return box;
}

// Each request (a span with phases) as a row of a waterfall, in start order: the request, its bars on one time axis, its
// status and time. A row jumps the video to its start.
function networkView(r, seek) {
  const fall = Tracks.waterfall(metricsOf(r));
  if (!fall.rows.length) return placeholder("No requests in this run. A web run records them; in a VM, start with --probe network.");
  const span = fall.to - fall.from || 1;
  const axis = $("div", { class: "req axis-row", "aria-hidden": "true" }, $("span"), $("div", { class: "axis" },
    ...Tracks.ticks(fall.from, fall.to).map(t => $("span", { class: "tick", style: `left:${(t - fall.from) / span * 100}%`, text: Tracks.axisLabel(t) }))), $("span"));
  const box = $("div", { class: "net" },
    $("div", { class: "legend" }, ...fall.names.map((name, i) => $("span", {}, $("i", { class: `p${i % 5}` }), name))), axis);
  const CAP = 500;
  for (const q of fall.rows.slice(0, CAP)) {
    const bad = q.ok === false, split = Tracks.request(q.label), tail = split.path.length > 16 ? 12 : 0;
    const bar = $("div", { class: "fall" }, $("span", { class: "whole", style: `left:${q.left * 100}%;width:${q.width * 100}%` }),
      ...q.parts.map(([name, left, width]) => $("span", { class: `p${fall.names.indexOf(name) % 5}`, title: `${name} ${Tracks.format(width * span, "s")}`,
        style: `left:${left * 100}%;width:${width * 100}%` })));
    box.append($("div", { class: `req${bad ? " bad" : ""}`, tabindex: "0", role: "button", title: q.label, "data-t": q.t,
      onclick: () => seek(toVideo(r, q.t) - 0.2), onkeydown: ev => { if (ev.key === "Enter") seek(toVideo(r, q.t) - 0.2); } },
      $("span", { class: "name" }, $("span", { class: "dim", text: `${split.method} ` }), $("span", { class: "dim host", text: split.host }),
        $("span", { class: "path head", text: tail ? split.path.slice(0, -tail) : split.path }), tail ? $("span", { class: "path tail", text: split.path.slice(-tail) }) : null),
      bar,
      $("span", { class: "d" }, q.status ? (bad ? chip(String(q.status), "bad") : $("span", { class: "dim", text: String(q.status) })) : null, $("span", { text: Tracks.format(q.d, "s") }))));
  }
  if (fall.rows.length > CAP) box.append($("p", { class: "hint", text: `${Verdict.plural(fall.rows.length - CAP, "more request")} not listed.` }));
  return box;
}

// The page draws on the video what the video does not: where the camera looks, the clock, the speed, the step, and
// the last action or check. Times come from the run's clock, so they line up with every speed of the video.
function stage(r, video, overlay) {
  const at = video.currentTime;
  if (r.camera && r.camera.length) {
    const [cx, cy, z] = zoom ? cameraAt(r.camera, at) : [0.5, 0.5, 1];
    const left = Math.min(Math.max(cx - 0.5 / z, 0), 1 - 1 / z), top = Math.min(Math.max(cy - 0.5 / z, 0), 1 - 1 / z);
    video.style.transform = z > 1.001 ? `scale(${z}) translate(${-left * 100}%, ${-top * 100}%)` : "";
  }
  if (!overlay) return;
  const real = toReal(r, at), speed = Tracks.timemap(r.clock).speed(at);
  const [clockPill, statePill, speedPill] = ["clock", "state", "speed"].map(name => overlay.querySelector(".top ." + name));
  clockPill.textContent = clock(Math.max(0, real));
  const visit = Machine.at(r, real);
  statePill.hidden = !visit;
  if (visit) {
    statePill.textContent = visit.name;
    statePill.className = `pill state ${VISITS[visitVerdict(visit)][1]}`;
  }
  speedPill.textContent = `${speed >= 2 ? Math.round(speed) : speed.toFixed(1)}x speed`;
  speedPill.style.opacity = Math.min(1, Math.max(0, (speed - 1.3) / 1.5));
  const steps = r.events.filter(e => e.kind === "step" && e.t <= real);
  const caption = overlay.querySelector(".caption");
  caption.style.opacity = steps.length ? ease((real - steps[steps.length - 1].t) / 0.3) : 0;
  if (steps.length) caption.replaceChildren($("b", { text: String(steps.length) }), steps[steps.length - 1].text);
  const recent = r.events.filter(e => e.chip && real - e.t >= 0 && real - e.t < 1.8 + (e.dur || 0));
  const now = overlay.querySelector(".now"), last = recent[recent.length - 1];
  now.style.opacity = last ? ease((real - last.t) / 0.15) * (1 - ease((real - last.t - 1.5 - (last.dur || 0)) / 0.3)) : 0;
  if (last) {
    now.textContent = chipText(last, r);
    now.className = "pill now" + (["check", "wait"].includes(last.kind) ? (last.ok ? " ok" : " bad") : "");
  }
}

function row(r, e, seek) {
  const budget = Verdict.isBudget(e), failed = e.ok === false && ["check", "wait"].includes(e.kind);
  const text = (budget ? Verdict.budgetOf(r, e) : e.text) + (e.reported ? " (reported)" : "");
  const status = e.kind === "check" ? chip(...budgetChip(e)) : null;
  const detail = budget ? null : e.kind === "wait" && e.detail ? Verdict.sentence(e.detail) : e.detail;
  const body = $("div", { class: "row", tabindex: "0", role: "button", "aria-label": `Jump to ${clock(e.t)}: ${text}` },
    $("span", { class: "t", text: clock(e.t) }),
    $("span", { class: "text" },
      ["step", "check", "note"].includes(e.kind) || e.text.startsWith(e.kind) ? null : $("span", { class: "kind", text: e.kind + " " }),
      document.createTextNode(text), detail ? $("span", { class: "detail", text: detail }) : null), status);
  const li = $("li", { class: e.kind + (failed ? " bad" : "") }, body);
  const go = () => seek(toVideo(r, e.t) - 0.4);
  body.addEventListener("click", go);
  body.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(); } });
  return li;
}

// The run's flow, top to bottom: a node for each state the run visited, with its time and checks, and under it the steps
// of that visit. A run with no states is one list of steps. The node and step at the video's time are lit, and the
// column follows them except for 4 s after the person scrolls it.
// Every run's states as one graph. The run on show is drawn strong: its path, a verdict on each node it visited, and
// how long each step took. The node the video is in lights up, and the page shows the details of a state under the drawing.
function machineView(r, seek) {
  const NS = "http://www.w3.org/2000/svg";
  const svg = (tag, attrs = {}, ...kids) => {
    const el = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
    for (const kid of kids) if (kid) el.append(kid);
    return el;
  };
  const graph = Machine.build(RUNS), current = RUNS.indexOf(r), many = RUNS.length > 1, states = r.states || [];
  const measure = document.createElement("canvas").getContext("2d");
  measure.font = "600 14px 'IBM Plex Sans', system-ui, sans-serif";
  const name = id => id.length > 32 ? id.slice(0, 31) + "…" : id;
  const size = id => id === Machine.START ? [measure.measureText(id).width + 24, 24] : [Math.max(64, measure.measureText(name(id)).width + 28), 40];
  const box = Machine.layout(graph, size, { x: 28, y: 64, lane: 16 });
  const pad = 8;
  const marker = (id, css) => svg("marker", { id, viewBox: "0 0 10 10", refX: "9", refY: "5", markerWidth: "8", markerHeight: "8", orient: "auto-start-reverse" },
    svg("path", { d: "M0,0 L10,5 L0,10 z", class: css }));
  const drawing = svg("svg", { role: "group", "aria-label": "State machine of the runs" },
    svg("defs", {}, marker("arrow", "head"), marker("arrow-on", "head on")));
  const start = (run, visit) => visit ? RUNS[run].states[visit - 1].t : 0;
  const small = document.createElement("canvas").getContext("2d");
  small.font = "12px 'IBM Plex Mono', ui-monospace, monospace";
  let left = 0, right = box.width;
  for (const e of box.edges) {
    const mine = e.takes.filter(x => x.run === current);
    const steps = mine.map(x => r.events.find(ev => ev.kind === "step" && ev.t >= start(current, x.visit) && ev.t < states[x.visit].t));
    const took = mine.map(x => states[x.visit].t - start(current, x.visit));
    const label = mine.length ? `${Tracks.format(took[0], "s")}${mine.length > 1 ? ` ×${mine.length}` : ""}` : "";
    const runs = [...new Set(e.takes.map(x => x.run))];
    const g = svg("g", { class: "edge" + (mine.length ? " on" : "") + (e.back ? " back" : ""),
      onclick: () => { if (mine.length) seek(toVideo(r, start(current, mine[0].visit)) - 0.2); } },
      svg("title", {}, `${e.from} to ${e.to}${many ? ` (${runs.map(i => RUNS[i].title).join(", ")})` : ""}${steps[0] ? ": " + steps[0].text : ""}`),
      svg("path", { d: e.d, class: "hit" }), svg("path", { d: e.d, class: "line", "marker-end": mine.length ? "url(#arrow-on)" : "url(#arrow)" }));
    if (label && e.label) {
      const [x, y, anchor, slope] = e.label, width = small.measureText(label).width, gap = 8 + slope * 7, at = anchor === "end" ? x - gap : x + gap;
      g.append(svg("text", { x: at, y: y + 4, "text-anchor": anchor, class: "label" }, label));
      left = Math.min(left, anchor === "end" ? at - width : at);
      right = Math.max(right, anchor === "end" ? at : at + width);
    }
    drawing.append(g);
  }
  const nodes = new Map(), halos = new Map();
  let pinned = pickState, following = null;
  pickState = null;
  // A state this run never visits opens the run that does (the failing one first, else the newest) at that state.
  const elsewhere = id => {
    const has = RUNS.map((x, i) => [i, Machine.verdict(x.states || [], id)]).filter(([i, v]) => v && i !== current);
    return (has.find(([, v]) => v === "bad") || has[has.length - 1] || [])[0];
  };
  const open = (i, id) => {
    pickState = id;
    location.hash = `run-${i + 1}&t=${Math.max(0, RUNS[i].states.find(v => v.name === id).t - 0.2).toFixed(1)}`;
  };
  const failing = states.find(v => v.ok === false);
  const shown = () => pinned || (failing ? failing.name : following);
  const sum = id => {
    const visits = states.filter(v => v.name === id), checks = r.events.filter(e => e.kind === "check" && !e.budget && visits.some(v => e.t >= v.t && e.t < v.end));
    return `${checks.filter(e => e.ok).length} of ${Verdict.plural(checks.length, "check")}`;
  };
  for (const n of box.nodes) {
    const here = Machine.verdict(states, n.id), first = n.id === Machine.START;
    const halo = svg("rect", { class: "halo", x: n.x - 4, y: n.y - 4, width: n.w + 8, height: n.h + 8, rx: 10 });
    const g = svg("g", { class: `node ${first ? "start" : here ? VISITS[here][1] : "away"}`, tabindex: first ? "-1" : "0", role: first ? "presentation" : "button",
      transform: `translate(${n.x},${n.y})` },
      svg("rect", { width: n.w, height: n.h, rx: 6 }),
      svg("text", { x: n.w / 2, y: n.h / 2 + 4.5, class: "name" }, first ? n.id : name(n.id)));
    if (!first) g.setAttribute("aria-label", `${n.id}, ${here ? `${{ ok: "passed", bad: "failed", unchecked: "not checked" }[here]}, ${sum(n.id)}` : `opens ${RUNS[elsewhere(n.id)].title}`}`);
    if (!first) {
      const pick = () => {
        if (!here) return open(elsewhere(n.id), n.id);
        pinned = pinned === n.id ? null : n.id;
        details();
        const v = states.find(v => v.name === n.id);
        if (pinned && v) seek(toVideo(r, v.t) - 0.2);
      };
      g.addEventListener("click", pick);
      g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pick(); } });
    }
    drawing.append(halo, g);
    nodes.set(n.id, g);
    halos.set(n.id, halo);
  }
  drawing.setAttribute("viewBox", `${left - pad} ${-pad} ${right - left + 2 * pad} ${box.height + 2 * pad}`);
  drawing.setAttribute("width", right - left + 2 * pad);
  const info = $("div", { class: "visit" });
  let detailed = null;
  const details = () => {
    const id = shown();
    detailed = id;
    nodes.forEach((g, key) => g.classList.toggle("picked", key === pinned));
    info.replaceChildren();
    if (!id || !nodes.has(id)) return;
    const here = Machine.verdict(states, id);
    info.append($("h2", {}, $("span", { text: id }), chip(...VISITS[here])));
    const visits = states.filter(v => v.name === id);
    const checks = r.events.filter(e => ["wait", "check"].includes(e.kind) && visits.some(v => e.t >= v.t && e.t < v.end));
    if (checks.length) { const ol = $("ol"); checks.forEach(e => ol.append(row(r, e, seek))); info.append(ol); }
    if (r.error && visits.includes(states[states.length - 1])) info.append($("p", { class: "stopped" }, chip("Stopped", "bad"), document.createTextNode(" " + r.error)));
    if (many) {
      const others = $("div", { class: "choices" });
      RUNS.forEach((x, i) => {
        const v = Machine.verdict(x.states, id);
        if (v && i !== current) others.append($("button", { type: "button", class: "btn small", onclick: () => open(i, id) },
          $("span", { text: x.title }), chip(...VISITS[v])));
      });
      if (others.children.length) info.append($("p", { class: "others", text: "In other runs:" }), others);
    }
  };
  details();
  const element = $("div", { class: "machine body" }, $("div", { class: "graph" }, drawing), info);
  const now = real => {
    const v = Machine.at(r, real);
    nodes.forEach((g, id) => { const on = !!v && v.name === id; g.classList.toggle("now", on); halos.get(id).classList.toggle("on", on); });
    following = v ? v.name : states.length ? states[0].name : null;
    if (shown() !== detailed) details();
  };
  const unpin = () => {
    if (!pinned) return false;
    pinned = null;
    details();
    return true;
  };
  return { element, now, unpin };
}

function flowView(r, seek) {
  const list = Machine.sections(r), body = $("div", { class: "body" }), items = $("ol", { class: "list flow-list" });
  const nodes = [], steps = [];
  list.forEach((s, i) => {
    const tone = VISITS[visitVerdict(s)][1], item = $("li", { class: `visit ${tone}` });
    if (s.visit) {
      const node = $("button", { type: "button", class: "visit-node", title: `${s.name}: ${VISITS[visitVerdict(s)][0]}`,
        onclick: () => seek(toVideo(r, s.t) - 0.2) },
        $("span", { class: "name", text: s.name }), $("span", { class: "t", text: clock(s.t) }),
        $("span", { class: "checks", text: Verdict.words(Verdict.tally(s.events)).join(" \u00b7 ") }), s.total || s.ok === false ? chip(...VISITS[tone]) : null);
      nodes.push(node);
      item.append(node);
    } else nodes.push(null);
    const ol = $("ol", { class: "steps" }), mine = [];
    let group = null, summary = null;
    for (const e of s.events) {
      if (e.row === "key") { const li = row(r, e, seek); ol.append(li); mine.push(li); group = null; continue; }
      if (!group) {
        group = $("ol"); summary = $("summary", {}, icon("chevron"), $("span"));
        ol.append($("li", { class: "more" }, $("details", {}, summary, group)));
      }
      const li = row(r, e, seek);
      group.append(li); mine.push(li);
      summary.lastChild.textContent = Verdict.plural(group.children.length, "action");
    }
    item.append(ol);
    items.append(item);
    steps.push(mine);
  });
  const lit = list.length === 1 && !list[0].events.length ? $("p", { class: "placeholder", text: "No steps were recorded." }) : null;
  body.append(lit || items);
  let touched = -Infinity, last = "";
  for (const name of ["wheel", "touchstart", "pointerdown", "keydown"]) body.addEventListener(name, () => { touched = Date.now(); }, { passive: true });
  const reveal = (el, pad) => {
    const box = body.getBoundingClientRect(), at = el.getBoundingClientRect();
    if (at.top < box.top + pad || at.bottom > box.bottom - 8) body.scrollTo({ top: body.scrollTop + at.top - box.top - body.clientHeight / 3, behavior: calm.matches ? "auto" : "smooth" });
  };
  const now = real => {
    const { section, event } = Machine.now(list, real), key = `${section}:${event}`;
    if (key === last) return;
    last = key;
    const li = event < 0 ? null : steps[section][event], folded = li && li.closest("details:not([open])");
    const mark = folded ? folded.parentElement : li;
    items.querySelectorAll(".now").forEach(el => el.classList.remove("now"));
    if (nodes[section]) nodes[section].classList.add("now");
    if (mark) mark.classList.add("now");
    if (Date.now() - touched < 4000) return;
    const node = nodes[section];
    if (mark) reveal(mark, node ? node.offsetHeight + 4 : 0); else if (node) reveal(node, 0);
  };
  return { element: body, now };
}

function flowPanel(r, seek) {
  const steps = flowView(r, seek), diagram = MACHINE ? machineView(r, seek) : null;
  const panes = { flow: diagram && diagram.element, steps: steps.element };
  let mode = diagram ? "flow" : "steps";
  const buttons = Object.keys(panes).filter(k => panes[k]).map(k => $("button", { type: "button", "aria-pressed": String(k === mode), text: k === "flow" ? "Flow" : "Steps",
    onclick: () => { mode = k; show(); } }));
  const show = () => {
    for (const k in panes) if (panes[k]) panes[k].hidden = k !== mode;
    buttons.forEach(b => b.setAttribute("aria-pressed", String(b.textContent.toLowerCase() === mode)));
  };
  show();
  const head = diagram ? $("div", { class: "head" }, $("div", { class: "seg", role: "group", "aria-label": "Show" }, ...buttons)) : $("h2", { text: "Steps" });
  return { element: $("aside", { class: "panel flow", "aria-label": "User flow" }, head, diagram && diagram.element, steps.element),
    now: real => { steps.now(real); if (diagram) diagram.now(real); },
    unpin: () => !!diagram && diagram.unpin() };
}

function reviewControl(r) {
  const panel = $("div", { class: "review", id: "review", hidden: "" });
  const choices = $("div", { class: "seg", role: "group", "aria-label": "Review" });
  for (const [value, label, css] of [["approve", "Approve", "ok"], ["needs-work", "Needs work", "bad"]]) {
    choices.append($("button", { type: "button", class: css, "data-v": value, "aria-pressed": "false", text: label, onclick: () => setReview(r, value) }));
  }
  panel.append(choices, $("div", { class: "who", role: "status", text: "No review yet." }));
  return panel;
}

let unwatch = null;
function watchReview(r) {
  if (unwatch) { unwatch(); unwatch = null; }
  const panel = document.getElementById("review");
  if (!caps.db || !panel) return;
  panel.hidden = false;
  const who = panel.querySelector(".who");
  const timer = setTimeout(() => { who.textContent = "Reviews are not loading here."; }, 10000);
  unwatch = caps.db.doc(`reviews/${r.id}`).onSnapshot(async snap => {
    clearTimeout(timer);
    const data = snap.exists ? snap.data() : null, set = data && data.verdict ? data : null;
    panel.querySelectorAll("[data-v]").forEach(b => b.setAttribute("aria-pressed", String(!!set && b.dataset.v === set.verdict)));
    if (!set) { who.textContent = "No review yet."; return; }
    let name = "Someone";
    if (caps.user && set.by) { const ps = await caps.user.profiles([set.by]); name = (ps[set.by] && ps[set.by].name) || "Someone"; }
    who.textContent = `${set.verdict === "approve" ? "Approved" : "Needs work"} by ${name}, ${new Date(set.at).toLocaleString()}`;
  }, () => { clearTimeout(timer); who.textContent = "Reviews are not available here."; });
}

async function setReview(r, verdict) {
  if (!caps.db) return;
  const who = document.querySelector("#review .who");
  const chosen = document.querySelector(`#review [data-v="${verdict}"]`).getAttribute("aria-pressed") === "true";
  try {
    const by = caps.user ? await caps.user.id() : null;
    await caps.db.doc(`reviews/${r.id}`).set({ verdict: chosen ? null : verdict, run: run + 1, title: r.title, by, at: Date.now() });
  } catch (err) { who.textContent = "Only people who can edit this page can review it."; }
}

function askPanel(r, video) {
  const panel = $("section", { class: "section ask", id: "ask" });
  panel.hidden = !caps.sample;
  const box = $("textarea", { "aria-label": "Ask about this moment", rows: "1", placeholder: "Why did the check fail?" });
  const answer = $("div", { class: "answer" });
  let controller = null;
  const ask = async () => {
    const question = box.value.trim();
    if (!question || !caps.sample) return;
    if (controller) controller.abort();
    controller = new AbortController();
    answer.textContent = "Thinking...";
    const at = video.currentTime;
    const log = r.events.filter(e => e.kind !== "move").map(e => `${clock(e.t)} (video ${toVideo(r, e.t).toFixed(1)} s) ${e.kind}: ${e.text}${e.kind === "check" || e.kind === "wait" ? (e.ok ? " [pass]" : " [FAIL]") : ""}${e.detail ? " - " + e.detail : ""}`).join("\n");
    const prompt = `You review a recorded test run of an app. Answer the question in plain words, in at most 5 sentences. Say what the frame shows and what the log shows; do not guess beyond them.\n\nRun: ${r.title}\nAbout: ${r.about || ""}\nResult: ${r.verdict}${r.error ? " (stopped: " + r.error + ")" : ""}\nThe attached image is the video frame at ${at.toFixed(1)} s.\n\nLog:\n${log}\n\nQuestion: ${question}`;
    const images = [];
    try {
      const canvas = document.createElement("canvas");
      canvas.width = Math.min(1280, video.videoWidth || 1280);
      canvas.height = Math.round(canvas.width * (video.videoHeight || 720) / (video.videoWidth || 1280));
      canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
      images.push(await new Promise(ok => canvas.toBlob(ok, "image/jpeg", 0.85)));
    } catch (err) {}
    try {
      const out = await caps.sample(prompt, { images: images.filter(Boolean), signal: controller.signal, cache: false,
        onText: ({ text }) => { answer.textContent = text; } });
      answer.textContent = out.text;
    } catch (err) {
      if (err && err.code === "cancelled") return;
      answer.textContent = err && err.code === "rate_limited" ? "Too many questions. Wait a moment." : "Claude could not answer here.";
      if (err && (err.code === "not_granted" || err.code === "images_unavailable")) panel.hidden = err.code === "not_granted";
    }
  };
  panel.append($("h2", { text: "Ask about this moment" }),
    $("div", { class: "body" }, $("div", { class: "ask-row" }, box, $("button", { type: "button", class: "btn", text: "Ask", onclick: ask })), answer));
  return panel;
}

window.addEventListener("hashchange", () => { fromHash(); render(); });
const fonts = document.fonts ? Promise.race([Promise.all([document.fonts.load("600 14px 'IBM Plex Sans'"), document.fonts.load("12px 'IBM Plex Mono'")]), new Promise(done => setTimeout(done, 1500))]).catch(() => {}) : Promise.resolve();
(async () => {
  await fonts;
  render();
  const use = name => (window.claude && window.claude.use ? window.claude.use(name) : Promise.resolve(null)).catch(() => null);
  const [db, user, sample] = await Promise.all([use("db"), use("user"), use("sample")]);
  Object.assign(caps, { db, user, sample });
  if (db || user || sample) render();
})();
</script>
