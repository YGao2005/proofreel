name: release
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: Tag must match the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/proofreel/__init__.py').read_text()).group(1))")
          test "${TAG#v}" = "$version" || { echo "Tag $TAG does not match version $version"; exit 1; }
      - run: python -m build
      - run: twine check dist/*
      - uses: pypa/gh-action-pypi-publish@v1.14.3
