name = "network"
version = "1"
os = ["linux"]
where = "host"
default = false
extras = "mitmproxy"
port = true
setup = true
fidelity = "A span runs from when the proxy got the request to the last byte of the answer: the hop from the guest to the proxy is not in it (so a slow-network condition does not show here: see `web/lcp`), and connect includes the DNS lookup. On Linux, only Chromium uses the proxy. An app that pins its certificates fails through the proxy, and the span says so."
privacy = "Keeps the host, the method, the path with ids and tokens taken out, the status, the size, and the times of each request. Never a query string, a header value, or a body. Nothing is written to disk but the CA, which is new for each session and deleted when it stops. The proxy refuses clients that are not the run VM; with QEMU, the guest connects from the host's 127.0.0.1, so a host process that finds the port can use it too."

[tracks."net/*"]
better = "lower"
