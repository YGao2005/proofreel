name = "processes"
version = "1"
os = ["macos", "linux", "windows"]
where = "guest"
default = true
fidelity = "CPU is each process's CPU time, read each INTERVAL seconds, as a % of one core; a process that starts and ends between two reads is not seen. The app is each process named PROOFREEL_APP (start --app), every process under it, and on macOS every process from the same .app bundle. Memory is PSS on Linux, the footprint on macOS, and private bytes on Windows. Processes of other users count in cpu/other only when the guest lets this user read them."
privacy = "Reads the name, parent, CPU time, and memory of each guest process. The names of the processes that use the most CPU leave it as series names; command lines and arguments do not."

[values]
INTERVAL = "1"

[tracks."cpu/app"]
label = "App CPU, % of one core"
unit = "%"
better = "lower"

[tracks."mem/app"]
label = "App memory"
unit = "MB"
better = "lower"

[tracks."app/procs"]
label = "App processes"
better = "lower"

[tracks."cpu/system"]
label = "Guest CPU (all cores)"
unit = "%"
better = "lower"
max = 100

[tracks."cpu/other"]
label = "Other processes' CPU, % of one core"
unit = "%"
better = "lower"

[tracks."cpu/top/*"]
label = "Top process CPU, % of one core"
unit = "%"
better = "lower"

[tracks."mem/system"]
label = "Guest memory in use"
unit = "MB"
better = "lower"
