<style>
html, body { height: 100%; }
[hidden] { display: none !important; }
.icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.chip { display: inline-flex; align-items: center; height: 20px; padding: 0 var(--s2); border-radius: var(--r-sm); font: 600 var(--fs-12)/1 var(--sans);
  background: var(--surface-3); color: var(--fg-2); white-space: nowrap; flex: none; }
.chip.ok { background: var(--good-bg); color: var(--good); } .chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.warn { background: var(--warn-bg); color: var(--warn); } .chip.accent { background: var(--accent-bg); color: var(--accent); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); height: var(--ctl); padding: 0 var(--s3); border-radius: var(--r-md);
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg-1); font: 500 var(--fs-14)/1 var(--sans); white-space: nowrap;
  transition: background-color 150ms var(--ease), border-color 150ms var(--ease); }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, var(--fg-1)); }
.btn.tool { border-color: transparent; background: transparent; color: var(--fg-2); padding: 0 var(--s2); }
.btn.icon-only { width: var(--ctl); padding: 0; }
.btn[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
.btn.bad[aria-pressed="true"] { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
kbd { font: 500 11px/1 var(--mono); padding: 2px 4px; border-radius: 3px; background: var(--surface-3); color: var(--fg-2); }
.btn.primary kbd { background: color-mix(in srgb, var(--on-accent) 22%, transparent); color: var(--on-accent); }
.seg { display: inline-flex; gap: var(--s1); padding: var(--s1); border-radius: var(--r-md); background: var(--surface-3); }
.seg button { display: inline-flex; align-items: center; gap: var(--s2); height: 24px; padding: 0 var(--s3); border: 1px solid transparent; border-radius: var(--r-sm); color: var(--fg-2); font: 500 var(--fs-13)/1 var(--sans); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg-1); border-color: var(--line-strong); }
.seg .n { font: 500 var(--fs-12)/1 var(--mono); color: var(--fg-3); }

.app { display: grid; grid-template-columns: 48px minmax(0, 1fr); height: 100dvh; position: relative; }
.rail { display: flex; flex-direction: column; align-items: center; gap: var(--s2); padding: var(--s2) 0; border-right: 1px solid var(--line); background: var(--surface-2); overflow-y: auto; scrollbar-width: none; }
.rail .count { font: 500 11px/1 var(--mono); color: var(--fg-3); }
.rail-items { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.rail-items button { position: relative; width: 34px; height: 34px; border-radius: var(--r-md); display: grid; place-items: center; border: 1px solid transparent; font: 600 var(--fs-12)/1 var(--sans); color: var(--fg-2); }
.rail-items button:hover { background: var(--hover); }
.rail-items button[aria-current="true"] { background: var(--surface); border-color: var(--line-strong); }
.rail-items .dot { position: absolute; right: 3px; bottom: 3px; width: 9px; height: 9px; border-radius: 50%; background: var(--fg-3); border: 2px solid var(--surface-2); }
.rail-items .dot.ok { background: var(--good); } .rail-items .dot.bad { background: var(--bad); } .rail-items .dot.warn { background: var(--warn); }
.drawer { position: absolute; left: 48px; top: 0; bottom: 0; width: 344px; z-index: 60; display: flex; flex-direction: column;
  background: var(--surface-2); border-right: 1px solid var(--line); box-shadow: 12px 0 32px rgba(16, 18, 22, .14); }
.drawer-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); height: 48px; padding: 0 var(--s3) 0 var(--s4); border-bottom: 1px solid var(--line); flex: none; }
.queue { flex: 1; overflow-y: auto; padding: var(--s3) var(--s2) var(--s4); display: flex; flex-direction: column; gap: var(--s1); }
.queue .none { padding: var(--s6) var(--s3); color: var(--fg-3); font-size: var(--fs-13); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s1) var(--s2); width: 100%; padding: var(--s2) var(--s3); border-radius: var(--r-md); border: 1px solid transparent; overflow: hidden; }
.row:hover { background: var(--hover); }
.row[aria-current="true"] { background: var(--surface); border-color: var(--line-strong); }
.row .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { grid-column: 1 / -1; display: flex; align-items: center; gap: var(--s2); color: var(--fg-3); font-size: var(--fs-12); min-width: 0; }
.row .sub .fold { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub .when { margin-left: auto; white-space: nowrap; }

.work { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.bar { position: relative; z-index: 20; display: flex; align-items: center; gap: var(--s3); height: 48px; flex: none; padding: 0 var(--s3) 0 var(--s4); border-bottom: 1px solid var(--line); background: var(--surface); }
.who { display: flex; align-items: center; gap: var(--s2); min-width: 0; flex: 1; color: var(--fg-2); font-size: var(--fs-13); white-space: nowrap; overflow: hidden; }
.who > * { flex: none; } .who .fold { min-width: 0; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
.who .mono { font-size: var(--fs-12); } .who .sep { color: var(--fg-3); }
.acts { display: flex; align-items: center; gap: 6px; flex: none; }
.drop { position: absolute; top: calc(100% + 6px); right: var(--s3); width: min(440px, calc(100vw - 72px)); z-index: 30; padding: var(--s3) var(--s4);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--pop-shadow); }
.compose { display: flex; flex-direction: column; gap: var(--s2); }
.compose label { font-weight: 600; font-size: var(--fs-13); }
.compose textarea { width: 100%; min-height: 64px; resize: vertical; padding: var(--s2) var(--s3); border: 1px solid var(--line-strong); border-radius: var(--r-md);
  background: var(--surface); color: var(--fg-1); font: 400 var(--fs-14)/1.5 var(--sans); }
.compose textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.compose .end { display: flex; justify-content: flex-end; gap: var(--s2); align-items: center; }
.compose .hint { margin-right: auto; color: var(--fg-3); font-size: var(--fs-12); }
.compose .error { color: var(--bad); font-size: var(--fs-13); }
.main { flex: 1; min-height: 0; position: relative; overflow-y: auto; display: flex; flex-direction: column; background: var(--bg); }
.main iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
.sent { width: 100%; max-width: 640px; margin: var(--s7) auto; padding: 0 var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
.sent h1 { font-size: 20px; font-weight: 600; line-height: 1.25; margin: 0; }
.sent .name { display: flex; align-items: center; gap: var(--s3); }
.sent pre { margin: 0; padding: var(--s3) var(--s4); font: 400 var(--fs-13)/1.6 var(--mono); white-space: pre-wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.sent p { margin: 0; color: var(--fg-2); }
.empty-pane { margin: auto; padding: var(--s7); text-align: center; display: flex; flex-direction: column; gap: var(--s2); max-width: 420px; }
.empty-pane h1 { font-size: 20px; font-weight: 600; margin: 0; }
.empty-pane p { margin: 0; color: var(--fg-2); }
.empty-pane code { font: 400 var(--fs-13) var(--mono); background: var(--surface-3); padding: 1px 6px; border-radius: var(--r-sm); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (max-width: 860px) { .acts .label, kbd, .who .wide { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<div class="app">
  <nav class="rail" aria-label="Queue">
    <button type="button" class="btn tool icon-only" id="open-queue" aria-expanded="false" aria-label="Open the queue" title="Queue ([)"><svg class="icon" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM9 5v14"/></svg></button>
    <span class="count" id="count"></span>
    <div class="rail-items"></div>
  </nav>
  <aside class="drawer" aria-label="Queue" hidden>
    <div class="drawer-head"><b>Review inbox</b>
      <div class="seg" role="group" aria-label="Show">
        <button type="button" data-view="waiting" aria-pressed="true">Waiting <span class="n"></span></button>
        <button type="button" data-view="sent" aria-pressed="false">Sent <span class="n"></span></button>
      </div>
    </div>
    <div class="queue"></div>
  </aside>
  <div class="work">
    <header class="bar"></header>
    <main class="main"></main>
  </div>
</div>
<div class="sr" role="status" aria-live="polite" id="live"></div>
