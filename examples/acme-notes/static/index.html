<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Acme Notes</title>
<style>
body { font: 28px system-ui; margin: 0; background: #f4f1ea; color: #222; }
main { max-width: 640px; margin: 120px auto; background: #fff; padding: 48px; border-radius: 16px; }
input, button { font: inherit; padding: 12px 16px; width: 100%; box-sizing: border-box; margin-top: 16px; }
button { background: #2b6cb0; color: #fff; border: 0; border-radius: 8px; }
</style>
<main>
  <h1>Acme Notes</h1>
  <p>Welcome back to your notes</p>
  <input id="email" placeholder="Email">
  <button id="go">Sign in</button>
</main>
<script>
document.getElementById("go").onclick = () => {
  localStorage.email = document.getElementById("email").value;
  location.href = "/notes.html";
};
</script>
